name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pipx install semgrep==1.179.0
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: https://example.invalid

  # Dogfooding: CodeGuard scans its own repository and publishes results to the Security tab.
  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: CodeGuard scan
        uses: ./
        with:
          path: .
          exclude: backend/tests
          fail-on: critical
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: codeguard.sarif
          category: codeguard
